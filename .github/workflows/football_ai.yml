name: Football AI Bot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ========================================================
      # PYTHON
      # ========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"


      # ========================================================
      # INSTALL DEPENDENCIES
      # ========================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-dotenv
          pip install feedparser
          pip install groq
          pip install requests
          pip install Pillow


      # ========================================================
      # RUN FOOTBALL AI
      # ========================================================

      - name: Run Football AI
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

        run: |
          echo "===================================="
          echo "FOOTBALL AI"
          echo "===================================="

          python main.py


      # ========================================================
      # PUBLISH TO FACEBOOK + INSTAGRAM
      # ========================================================

      - name: Publish to Facebook and Instagram
        if: success()
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}

          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

        run: |
          echo "===================================="
          echo "SOCIAL PUBLISHER"
          echo "===================================="

          python social_publisher.py


      # ========================================================
      # SAVE DATABASE
      # ========================================================

      - name: Save news database
        if: always()
        run: |

          echo "===================================="
          echo "SAVE DATABASE"
          echo "===================================="

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git status --short

          if [ -f "news.db" ]; then

            git add news.db

            if git diff --cached --quiet; then

              echo "No database changes to commit."

            else

              git commit -m "Update football news database"

              git push

              echo "news.db saved successfully."

            fi

          else

            echo "news.db not found."

          fi